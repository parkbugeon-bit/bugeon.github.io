<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>박부건 | PJ IT COMPANY</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at center, #222 0%, #000 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      overflow: hidden;
    }

    img {
      width: 180px;
      height: auto;
      filter: drop-shadow(0 0 15px rgba(0, 200, 255, 0.6));
      margin-bottom: 25px;
      animation: fadeIn 2s ease;
    }

    h1 {
      font-size: 2em;
      color: #00b7ff;
      margin-bottom: 10px;
      animation: fadeIn 2.5s ease;
    }

    h2 {
      font-size: 1.2em;
      opacity: 0.8;
      animation: fadeIn 3s ease;
    }

    p {
      color: #bbb;
      font-size: 0.95em;
      margin-top: 15px;
      animation: fadeIn 3.5s ease;
    }

    footer {
      position: absolute;
      bottom: 15px;
      font-size: 0.8em;
      color: #666;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <img src="logo.png" alt="PJ IT COMPANY 로고">
  <h1>박부건 (Bugun Park)</h1>
  <h2>PJ IT COMPANY · Technologies</h2>
  <p>생년월일: 2010년 11월 6일</p>

  <footer>© 2025 PJ IT COMPANY. All rights reserved.</footer>
</body>
</html>
